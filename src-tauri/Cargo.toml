[package]
name = "beezdesktop"
version = "0.1.11"
description = "Beez Desktop (SvelteKit + Tauri)"
authors = ["Enrico Zanardo"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/enricozanardo/BeezDesktop-tauri"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
